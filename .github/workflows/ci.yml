name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src
      - run: xvfb-run -a pytest
      - run: xvfb-run -a python tests/gui_widget_smoke.py
      - run: tpxlab --version
      - run: tpxlab-gui --smoke-test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - run: python -m venv /tmp/tpxlab-clean
      - run: /tmp/tpxlab-clean/bin/pip install dist/*.whl
      - run: /tmp/tpxlab-clean/bin/tpxlab --version
      - run: /tmp/tpxlab-clean/bin/tpxlab analyze examples/synthetic_tpr.csv --output /tmp/tpxlab-smoke.xlsx --baseline linear --prominence 0.1 --peak-center 300
