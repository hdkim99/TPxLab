name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tpxlab-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  required:
    name: CI / required
    # Only owner-authored same-repository PRs may execute on the persistent DGX.
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == github.repository_owner &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, dgx-spark]
    timeout-minutes: 60
    env:
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Configure and verify the shared headless GUI runtime
        env:
          TPXLAB_GUI_RUNTIME: /opt/catalysttwin-actions/shared-gui-runtime
        run: |
          test -x "${TPXLAB_GUI_RUNTIME}/usr/bin/Xvfb"
          test -x "${TPXLAB_GUI_RUNTIME}/usr/bin/xvfb-run"
          test -d "${TPXLAB_GUI_RUNTIME}/usr/lib/aarch64-linux-gnu"
          test -d "${TPXLAB_GUI_RUNTIME}/usr/share/tcltk/tk8.6"
          echo "${TPXLAB_GUI_RUNTIME}/usr/bin" >> "${GITHUB_PATH}"
          {
            echo "LD_LIBRARY_PATH=${TPXLAB_GUI_RUNTIME}/usr/lib/aarch64-linux-gnu${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
            echo "TK_LIBRARY=${TPXLAB_GUI_RUNTIME}/usr/share/tcltk/tk8.6"
          } >> "${GITHUB_ENV}"
          export PATH="${TPXLAB_GUI_RUNTIME}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${TPXLAB_GUI_RUNTIME}/usr/lib/aarch64-linux-gnu${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          export TK_LIBRARY="${TPXLAB_GUI_RUNTIME}/usr/share/tcltk/tk8.6"
          command -v Xvfb
          command -v xvfb-run
          python -c 'import tkinter; print(f"Tk {tkinter.TkVersion}")'
      - name: Create isolated job environment
        run: |
          export TPXLAB_CI_ROOT="${RUNNER_TEMP}/tpxlab-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "TPXLAB_CI_ROOT=${TPXLAB_CI_ROOT}"
            echo "RUFF_CACHE_DIR=${TPXLAB_CI_ROOT}/ruff-cache"
            echo "MYPY_CACHE_DIR=${TPXLAB_CI_ROOT}/mypy-cache"
            echo "MPLCONFIGDIR=${TPXLAB_CI_ROOT}/matplotlib"
          } >> "${GITHUB_ENV}"
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ["TPXLAB_CI_ROOT"]).resolve()
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          if root.parent != runner_temp or not root.name.startswith("tpxlab-ci-"):
              raise RuntimeError(f"unsafe CI root: {root}")
          if root.exists():
              shutil.rmtree(root)
          (root / "tmp").mkdir(parents=True)
          PY
          python -m venv "${TPXLAB_CI_ROOT}/dev-venv"
      - name: Install project without a pip cache
        run: |
          "${TPXLAB_CI_ROOT}/dev-venv/bin/python" -m pip install --upgrade pip
          "${TPXLAB_CI_ROOT}/dev-venv/bin/python" -m pip install -e ".[dev]"
          "${TPXLAB_CI_ROOT}/dev-venv/bin/python" -m pip check
      - name: Verify ARM64 scientific wheels and GUI runtime
        run: |
          command -v xvfb-run
          "${TPXLAB_CI_ROOT}/dev-venv/bin/python" scripts/ci/verify_arm64_runtime.py
      - name: Check formatting
        run: >-
          "${TPXLAB_CI_ROOT}/dev-venv/bin/python" -m ruff format --check .
      - name: Lint
        run: >-
          "${TPXLAB_CI_ROOT}/dev-venv/bin/python" -m ruff check .
      - name: Type check
        run: >-
          "${TPXLAB_CI_ROOT}/dev-venv/bin/python" -m mypy src
      - name: Unit, integration, scientific, CLI, and GUI tests
        run: >-
          xvfb-run -a "${TPXLAB_CI_ROOT}/dev-venv/bin/python" -m pytest
          -o cache_dir="${TPXLAB_CI_ROOT}/pytest-cache"
          --basetemp="${TPXLAB_CI_ROOT}/pytest-temp"
      - name: Exercise the editable CLI and real GUI widgets
        run: |
          "${TPXLAB_CI_ROOT}/dev-venv/bin/tpxlab" --version
          "${TPXLAB_CI_ROOT}/dev-venv/bin/tpxlab" --help
          xvfb-run -a "${TPXLAB_CI_ROOT}/dev-venv/bin/tpxlab-gui" --smoke-test
          xvfb-run -a "${TPXLAB_CI_ROOT}/dev-venv/bin/python" tests/gui_widget_smoke.py
      - name: Build and verify distributions
        run: |
          "${TPXLAB_CI_ROOT}/dev-venv/bin/python" -m build --outdir "${TPXLAB_CI_ROOT}/dist" .
          "${TPXLAB_CI_ROOT}/dev-venv/bin/python" -m twine check "${TPXLAB_CI_ROOT}"/dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv "${TPXLAB_CI_ROOT}/clean-venv"
          "${TPXLAB_CI_ROOT}/clean-venv/bin/python" -m pip install --upgrade pip
          "${TPXLAB_CI_ROOT}/clean-venv/bin/python" -m pip install "${TPXLAB_CI_ROOT}"/dist/*.whl
          "${TPXLAB_CI_ROOT}/clean-venv/bin/python" -m pip check
          "${TPXLAB_CI_ROOT}/clean-venv/bin/python" -c "import tpxlab; assert tpxlab.__version__ == '0.2.2'"
      - name: Exercise installed CLI, GUI, and example workflows
        run: |
          "${TPXLAB_CI_ROOT}/clean-venv/bin/tpxlab" --help
          "${TPXLAB_CI_ROOT}/clean-venv/bin/tpxlab" analyze examples/synthetic_tpr.csv --output "${TPXLAB_CI_ROOT}/independent-smoke.xlsx" --baseline linear --prominence 0.1 --peak-center 300
          "${TPXLAB_CI_ROOT}/clean-venv/bin/tpxlab" analyze examples/overlapping_tpr.csv --output "${TPXLAB_CI_ROOT}/global-smoke.xlsx" --baseline linear --components-config examples/overlapping_components.json
          test -s "${TPXLAB_CI_ROOT}/independent-smoke.xlsx"
          test -s "${TPXLAB_CI_ROOT}/global-smoke.xlsx"
          xvfb-run -a "${TPXLAB_CI_ROOT}/clean-venv/bin/tpxlab-gui" --smoke-test
          xvfb-run -a "${TPXLAB_CI_ROOT}/clean-venv/bin/python" tests/gui_widget_smoke.py
      - name: Remove isolated job environment
        if: always()
        run: |
          export TPXLAB_CI_ROOT="${TPXLAB_CI_ROOT:-${RUNNER_TEMP}/tpxlab-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ["TPXLAB_CI_ROOT"]).resolve()
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          if root.parent != runner_temp or not root.name.startswith("tpxlab-ci-"):
              raise RuntimeError(f"unsafe CI cleanup target: {root}")
          shutil.rmtree(root, ignore_errors=True)
          PY
